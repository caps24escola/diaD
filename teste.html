<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mulheres na Ciência — Jogo da Memória</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Space+Grotesk:wght@400;500;600;700&display=swap');

  :root{
    --bg-0:#0E1224;
    --bg-1:#161C36;
    --card-back:#1C2444;
    --card-edge:#2C3562;
    --gold:#D9A441;
    --gold-soft:#E7C077;
    --teal:#3FA796;
    --coral:#E1614E;
    --ink:#EDE8DD;
    --ink-muted:#9099BB;
    --paper:#F4EFE4;
    --paper-ink:#26243A;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse at 20% -10%, #232C56 0%, transparent 55%),
      radial-gradient(ellipse at 85% 110%, #241E44 0%, transparent 50%),
      var(--bg-0);
    color:var(--ink);
    font-family:'Space Grotesk', sans-serif;
    padding:32px 16px 64px;
    position:relative;
    overflow-x:hidden;
  }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
      radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,.5) 0, transparent 100%),
      radial-gradient(1px 1px at 80% 15%, rgba(255,255,255,.35) 0, transparent 100%),
      radial-gradient(1.5px 1.5px at 60% 70%, rgba(255,255,255,.4) 0, transparent 100%),
      radial-gradient(1px 1px at 30% 85%, rgba(255,255,255,.3) 0, transparent 100%),
      radial-gradient(1px 1px at 92% 60%, rgba(255,255,255,.4) 0, transparent 100%),
      radial-gradient(1.5px 1.5px at 45% 35%, rgba(255,255,255,.3) 0, transparent 100%);
    pointer-events:none;
    opacity:.6;
  }

  .wrap{
    max-width:960px;
    margin:0 auto;
    position:relative;
  }

  header{
    text-align:center;
    margin-bottom:28px;
  }

  .eyebrow{
    font-size:12px;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:var(--gold-soft);
    font-weight:600;
    margin-bottom:10px;
  }

  h1{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-style:italic;
    font-size:clamp(32px,6vw,54px);
    margin:0 0 8px;
    line-height:1.05;
    background:linear-gradient(120deg,var(--paper) 20%,var(--gold-soft) 60%,var(--paper) 90%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
  }

  .subtitle{
    color:var(--ink-muted);
    font-size:15px;
    max-width:520px;
    margin:0 auto;
    line-height:1.5;
  }

  .stats{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin:24px 0 28px;
  }

  .stat{
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.08);
    border-radius:10px;
    padding:10px 18px;
    text-align:center;
    min-width:88px;
  }

  .stat .n{
    font-family:'Fraunces', serif;
    font-size:22px;
    font-weight:600;
    color:var(--gold-soft);
    display:block;
  }
  .stat .l{
    font-size:10px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-muted);
  }

  .restart-btn{
    background:transparent;
    border:1px solid var(--gold);
    color:var(--gold-soft);
    padding:10px 20px;
    border-radius:10px;
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:13px;
    letter-spacing:.03em;
    cursor:pointer;
    transition:background .2s, color .2s, transform .15s;
  }
  .restart-btn:hover{ background:var(--gold); color:var(--bg-0); }
  .restart-btn:active{ transform:scale(.97); }
  .restart-btn:focus-visible{ outline:2px solid var(--teal); outline-offset:3px; }

  .board{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:12px;
    perspective:1200px;
  }
  @media (max-width:640px){
    .board{ grid-template-columns:repeat(3, 1fr); gap:9px; }
  }

  .cell{
    aspect-ratio:3/4;
    position:relative;
  }

  .card{
    width:100%;
    height:100%;
    position:relative;
    transform-style:preserve-3d;
    transition:transform .55s cubic-bezier(.2,.8,.2,1);
    cursor:pointer;
    border-radius:12px;
  }
  .card.flipped{ transform:rotateY(180deg); }
  .card.matched{ cursor:default; }
  .card:focus-visible{ outline:2px solid var(--teal); outline-offset:4px; border-radius:12px; }

  .face{
    position:absolute; inset:0;
    border-radius:12px;
    backface-visibility:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:10px;
    text-align:center;
  }

  .face-back{
    background:
      linear-gradient(155deg, var(--card-back), var(--bg-1));
    border:1px solid var(--card-edge);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.03);
  }
  .face-back::after{
    content:"?";
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:clamp(26px,6vw,38px);
    color:var(--gold);
    opacity:.55;
  }
  .face-back .corner{
    position:absolute; top:8px; left:10px;
    font-size:9px; letter-spacing:.16em; color:var(--ink-muted); opacity:.5;
    text-transform:uppercase;
  }

  .face-front{
    background:var(--paper);
    color:var(--paper-ink);
    transform:rotateY(180deg);
    border:1px solid #d8cfb6;
  }

  .card.matched .face-front{
    background:#F4EFE4;
    box-shadow:0 0 0 2px var(--teal), 0 8px 22px -6px rgba(63,167,150,.5);
  }

  .type-tag{
    font-size:9px;
    letter-spacing:.14em;
    text-transform:uppercase;
    font-weight:700;
    padding:2px 7px;
    border-radius:20px;
    margin-bottom:6px;
  }
  .type-name .type-tag{ background:#e7c077; color:#3a2c0f; }
  .type-fact .type-tag{ background:#3fa796; color:#0e1224; }

  .icon{ font-size:clamp(20px,5vw,28px); margin-bottom:2px; }

  .name-text{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(11px,2.6vw,14px);
    line-height:1.15;
  }
  .fact-text{
    font-size:clamp(9.5px,2.2vw,11px);
    line-height:1.3;
    color:#3a3752;
  }

  .stamp{
    position:absolute;
    bottom:6px; right:6px;
    font-size:8px;
    color:var(--teal);
    font-weight:700;
    letter-spacing:.08em;
    opacity:0;
    transform:rotate(-8deg) scale(.6);
    transition:opacity .3s .25s, transform .3s .25s;
  }
  .card.matched .stamp{ opacity:1; transform:rotate(-8deg) scale(1); }

  .card.shake{ animation:shake .4s; }
  @keyframes shake{
    20%,60%{ transform:translateX(-4px) rotateY(0); }
    40%,80%{ transform:translateX(4px) rotateY(0); }
  }

  footer{
    text-align:center;
    margin-top:36px;
    color:var(--ink-muted);
    font-size:12px;
    letter-spacing:.03em;
  }

  /* win modal */
  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(10,12,26,.82);
    backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    z-index:50;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s;
  }
  .modal-overlay.show{ opacity:1; pointer-events:auto; }

  .modal{
    background:var(--paper);
    color:var(--paper-ink);
    border-radius:16px;
    max-width:640px;
    width:100%;
    max-height:86vh;
    overflow-y:auto;
    padding:32px 28px;
    position:relative;
    transform:translateY(16px);
    transition:transform .3s;
  }
  .modal-overlay.show .modal{ transform:translateY(0); }

  .modal h2{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:28px;
    margin:0 0 4px;
    color:#2b2440;
  }
  .modal .modal-sub{
    font-size:13px;
    color:#6b6480;
    margin-bottom:20px;
  }

  .bio-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  @media (max-width:520px){ .bio-grid{ grid-template-columns:1fr; } }

  .bio{
    background:#fff;
    border:1px solid #e5ddc8;
    border-radius:10px;
    padding:12px 14px;
  }
  .bio .bname{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:14px;
    margin-bottom:3px;
    color:#26243A;
  }
  .bio .bfact{
    font-size:11.5px;
    color:#524d68;
    line-height:1.4;
  }

  .modal-close{
    margin-top:22px;
    width:100%;
    background:var(--paper-ink);
    color:var(--paper);
    border:none;
    padding:12px;
    border-radius:10px;
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
  }
  .modal-close:hover{ opacity:.9; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Dia D de Tecnologia</div>
    <h1>Mulheres na Ciência</h1>
    <p class="subtitle">Encontre os pares: uma carta traz o nome da cientista, a outra traz sua descoberta. Combine as duas para revelar a dupla.</p>
  </header>

  <div class="stats">
    <div class="stat"><span class="n" id="moves">0</span><span class="l">Jogadas</span></div>
    <div class="stat"><span class="n" id="timer">00:00</span><span class="l">Tempo</span></div>
    <div class="stat"><span class="n" id="pairs">0/8</span><span class="l">Pares</span></div>
    <button class="restart-btn" id="restartBtn">↻ Reiniciar</button>
  </div>

  <div class="board" id="board"></div>

  <footer>Um jogo da memória em homenagem às mulheres que mudaram a ciência.</footer>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2>Todas as pares encontrados! 🎉</h2>
    <p class="modal-sub" id="modalSub"></p>
    <div class="bio-grid" id="bioGrid"></div>
    <button class="modal-close" id="modalClose">Jogar novamente</button>
  </div>
</div>

<script>
const SCIENTISTS = [
  { id:1, name:"Marie Curie", icon:"⚛️", fact:"Única pessoa a ganhar Nobel em duas ciências: Física e Química, por seus estudos sobre radioatividade." },
  { id:2, name:"Ada Lovelace", icon:"💻", fact:"Escreveu o primeiro algoritmo da história, sendo considerada a primeira programadora do mundo." },
  { id:3, name:"Rosalind Franklin", icon:"🧬", fact:"Suas imagens de raio-X foram essenciais para descobrir a estrutura em dupla hélice do DNA." },
  { id:4, name:"Katherine Johnson", icon:"🚀", fact:"Calculou manualmente as trajetórias que levaram astronautas da NASA com segurança ao espaço." },
  { id:5, name:"Chien-Shiung Wu", icon:"🔬", fact:"Realizou o experimento que derrubou a lei da conservação da paridade na física de partículas." },
  { id:6, name:"Rita Levi-Montalcini", icon:"🧠", fact:"Descobriu o fator de crescimento neural, avanço fundamental para a neurociência moderna." },
  { id:7, name:"Tu Youyou", icon:"💊", fact:"Descobriu a artemisinina, tratamento que salvou milhões de vidas contra a malária." },
  { id:8, name:"Mary Anning", icon:"🦴", fact:"Encontrou fósseis revolucionários, como o primeiro ictiossauro, moldando a paleontologia." }
];

let deck = [];
let flipped = [];
let matchedCount = 0;
let moves = 0;
let timerInterval = null;
let seconds = 0;
let lock = false;

const boardEl = document.getElementById('board');
const movesEl = document.getElementById('moves');
const timerEl = document.getElementById('timer');
const pairsEl = document.getElementById('pairs');
const modalOverlay = document.getElementById('modalOverlay');
const bioGrid = document.getElementById('bioGrid');
const modalSub = document.getElementById('modalSub');

function shuffle(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function buildDeck(){
  const cards = [];
  SCIENTISTS.forEach(s => {
    cards.push({ uid: s.id + '-name', pairId: s.id, type: 'name', data: s });
    cards.push({ uid: s.id + '-fact', pairId: s.id, type: 'fact', data: s });
  });
  return shuffle(cards);
}

function formatTime(s){
  const m = Math.floor(s/60).toString().padStart(2,'0');
  const sec = (s%60).toString().padStart(2,'0');
  return `${m}:${sec}`;
}

function startTimer(){
  if(timerInterval) return;
  timerInterval = setInterval(() => {
    seconds++;
    timerEl.textContent = formatTime(seconds);
  }, 1000);
}

function stopTimer(){
  clearInterval(timerInterval);
  timerInterval = null;
}

function render(){
  boardEl.innerHTML = '';
  deck.forEach(card => {
    const cell = document.createElement('div');
    cell.className = 'cell';

    const btn = document.createElement('button');
    btn.className = 'card';
    btn.setAttribute('data-uid', card.uid);
    btn.setAttribute('aria-label', 'Carta virada para baixo');

    const back = document.createElement('div');
    back.className = 'face face-back';
    back.innerHTML = '<span class="corner">Espécime</span>';

    const front = document.createElement('div');
    front.className = `face face-front type-${card.type}`;

    if(card.type === 'name'){
      front.innerHTML = `
        <span class="type-tag">Nome</span>
        <span class="icon">${card.data.icon}</span>
        <span class="name-text">${card.data.name}</span>
        <span class="stamp">✓ PAR</span>
      `;
    } else {
      front.innerHTML = `
        <span class="type-tag">Descoberta</span>
        <span class="fact-text">${card.data.fact}</span>
        <span class="stamp">✓ PAR</span>
      `;
    }

    btn.appendChild(back);
    btn.appendChild(front);
    btn.addEventListener('click', () => onCardClick(btn, card));
    btn.addEventListener('keydown', e => {
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); onCardClick(btn, card); }
    });

    cell.appendChild(btn);
    boardEl.appendChild(cell);
  });
}

function onCardClick(el, card){
  if(lock) return;
  if(el.classList.contains('flipped') || el.classList.contains('matched')) return;
  if(flipped.length === 2) return;

  startTimer();
  el.classList.add('flipped');
  el.setAttribute('aria-label', card.type === 'name' ? card.data.name : card.data.fact);
  flipped.push({ el, card });

  if(flipped.length === 2){
    moves++;
    movesEl.textContent = moves;
    lock = true;
    checkMatch();
  }
}

function checkMatch(){
  const [a, b] = flipped;
  const isMatch = a.card.pairId === b.card.pairId && a.card.type !== b.card.type;

  if(isMatch){
    setTimeout(() => {
      a.el.classList.add('matched');
      b.el.classList.add('matched');
      matchedCount++;
      pairsEl.textContent = `${matchedCount}/8`;
      flipped = [];
      lock = false;
      if(matchedCount === SCIENTISTS.length){
        stopTimer();
        setTimeout(showWin, 500);
      }
    }, 450);
  } else {
    a.el.classList.add('shake');
    b.el.classList.add('shake');
    setTimeout(() => {
      a.el.classList.remove('flipped','shake');
      b.el.classList.remove('flipped','shake');
      a.el.setAttribute('aria-label','Carta virada para baixo');
      b.el.setAttribute('aria-label','Carta virada para baixo');
      flipped = [];
      lock = false;
    }, 750);
  }
}

function showWin(){
  modalSub.textContent = `Você encontrou as 8 cientistas em ${moves} jogadas e ${formatTime(seconds)}.`;
  bioGrid.innerHTML = SCIENTISTS.map(s => `
    <div class="bio">
      <div class="bname">${s.icon} ${s.name}</div>
      <div class="bfact">${s.fact}</div>
    </div>
  `).join('');
  modalOverlay.classList.add('show');
}

function resetGame(){
  stopTimer();
  seconds = 0;
  moves = 0;
  matchedCount = 0;
  flipped = [];
  lock = false;
  timerEl.textContent = '00:00';
  movesEl.textContent = '0';
  pairsEl.textContent = '0/8';
  modalOverlay.classList.remove('show');
  deck = buildDeck();
  render();
}

document.getElementById('restartBtn').addEventListener('click', resetGame);
document.getElementById('modalClose').addEventListener('click', resetGame);

resetGame();
</script>
</body>
</html>
