<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Velha: Mulheres na Ciência</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1f1c2c, #928dab);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 2.2rem;
      color: #00d2ff;
      margin-bottom: 8px;
    }

    p {
      font-size: 1rem;
      opacity: 0.9;
    }

    .turn-indicator {
      margin: 15px 0;
      font-size: 1.2rem;
      font-weight: bold;
      background: rgba(255, 255, 255, 0.1);
      padding: 10px 20px;
      border-radius: 20px;
      backdrop-filter: blur(5px);
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      grid-template-rows: repeat(3, 100px);
      gap: 10px;
      margin-bottom: 20px;
    }

    .cell {
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      cursor: pointer;
      transition: all 0.3s ease;
      user-select: none;
    }

    .cell:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: scale(1.05);
    }

    .cell.taken {
      cursor: not-allowed;
    }

    .message {
      font-size: 1.2rem;
      font-weight: bold;
      text-align: center;
      min-height: 50px;
      margin-bottom: 15px;
      color: #00e676;
    }

    button {
      background-color: #00d2ff;
      color: #1f1c2c;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    button:hover {
      background-color: #0099cc;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <header>
    <h1>🧪 Jogo da Velha Científico</h1>
    <p>Dia D da Tecnologia — Escolha seu lado na ciência!</p>
  </header>

  <div class="turn-indicator" id="turnIndicator">
    Vez de: ⚛️ Marie Curie
  </div>

  <div class="board" id="board">
    <div class="cell" data-index="0"></div>
    <div class="cell" data-index="1"></div>
    <div class="cell" data-index="2"></div>
    <div class="cell" data-index="3"></div>
    <div class="cell" data-index="4"></div>
    <div class="cell" data-index="5"></div>
    <div class="cell" data-index="6"></div>
    <div class="cell" data-index="7"></div>
    <div class="cell" data-index="8"></div>
  </div>

  <div class="message" id="message"></div>

  <button onclick="resetGame()">Reiniciar Partida</button>

  <script>
    const players = {
      P1: { symbol: "⚛️", name: "Marie Curie (Física e Química)" },
      P2: { symbol: "💻", name: "Ada Lovelace (Computação)" }
    };

    let currentPlayer = 'P1';
    let gameState = ["", "", "", "", "", "", "", "", ""];
    let gameActive = true;

    const winningConditions = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8], // Linhas
      [0, 3, 6], [1, 4, 7], [2, 5, 8], // Colunas
      [0, 4, 8], [2, 4, 6]             // Diagonais
    ];

    const cells = document.querySelectorAll('.cell');
    const turnIndicator = document.getElementById('turnIndicator');
    const message = document.getElementById('message');

    cells.forEach(cell => cell.addEventListener('click', handleCellClick));

    function handleCellClick(event) {
      const clickedCell = event.target;
      const index = parseInt(clickedCell.getAttribute('data-index'));

      if (gameState[index] !== "" || !gameActive) return;

      gameState[index] = players[currentPlayer].symbol;
      clickedCell.textContent = players[currentPlayer].symbol;
      clickedCell.classList.add('taken');

      checkResult();
    }

    function checkResult() {
      let roundWon = false;

      for (let i = 0; i < winningConditions.length; i++) {
        const [a, b, c] = winningConditions[i];
        if (gameState[a] && gameState[a] === gameState[b] && gameState[a] === gameState[c]) {
          roundWon = true;
          break;
        }
      }

      if (roundWon) {
        message.innerHTML = `🎉 Vitória de <strong>${players[currentPlayer].name}</strong>!`;
        turnIndicator.textContent = "Fim de jogo!";
        gameActive = false;
        return;
      }

      if (!gameState.includes("")) {
        message.textContent = "⚖️ Empate! A ciência venceu desta vez!";
        turnIndicator.textContent = "Fim de jogo!";
        gameActive = false;
        return;
      }

      currentPlayer = currentPlayer === 'P1' ? 'P2' : 'P1';
      turnIndicator.textContent = `Vez de: ${players[currentPlayer].symbol} ${players[currentPlayer].name.split(' ')[0]} ${players[currentPlayer].name.split(' ')[1]}`;
    }

    function resetGame() {
      gameState = ["", "", "", "", "", "", "", "", ""];
      gameActive = true;
      currentPlayer = 'P1';
      message.textContent = "";
      turnIndicator.textContent = `Vez de: ${players.P1.symbol} Marie Curie`;
      
      cells.forEach(cell => {
        cell.textContent = "";
        cell.classList.remove('taken');
      });
    }
  </script>
</body>
</html>
