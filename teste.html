<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Memória - Mulheres na Ciência</title>
  <style>
    /* Reset e estilos gerais */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(145deg, #f7f0fc 0%, #e8dff5 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      width: 100%;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(8px);
      border-radius: 40px;
      padding: 30px 25px 35px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.5);
      transition: all 0.3s ease;
    }

    h1 {
      text-align: center;
      font-size: 2.2rem;
      font-weight: 700;
      color: #3d2a5c;
      letter-spacing: 1px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    h1 span {
      background: #5b3a8a;
      color: #fff;
      font-size: 1rem;
      padding: 4px 16px;
      border-radius: 30px;
      font-weight: 500;
    }

    .subtitle {
      text-align: center;
      font-size: 1rem;
      color: #5b4a6b;
      margin-bottom: 20px;
      border-bottom: 2px dashed #c9b5db;
      padding-bottom: 12px;
    }

    /* Painel de estatísticas */
    .stats {
      display: flex;
      justify-content: space-between;
      background: rgba(91, 58, 138, 0.08);
      padding: 12px 20px;
      border-radius: 60px;
      margin-bottom: 25px;
      flex-wrap: wrap;
      gap: 8px 16px;
      border: 1px solid rgba(91, 58, 138, 0.15);
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      color: #3d2a5c;
      font-size: 1rem;
    }

    .stat-item .icon {
      font-size: 1.3rem;
    }

    .stat-item .value {
      background: #5b3a8a;
      color: white;
      padding: 0 12px;
      border-radius: 30px;
      font-size: 1.1rem;
      min-width: 28px;
      text-align: center;
    }

    /* Grid do jogo */
    .memory-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 25px;
    }

    /* Cartas */
    .card {
      aspect-ratio: 1 / 1;
      background: transparent;
      perspective: 800px;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .card:hover:not(.matched) .card-inner {
      transform: scale(1.03);
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
      transform-style: preserve-3d;
      border-radius: 20px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.10);
    }

    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card.matched .card-inner {
      transform: rotateY(180deg);
    }

    .card.matched {
      cursor: default;
      filter: drop-shadow(0 0 8px rgba(91, 58, 138, 0.3));
    }

    .card-front,
    .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 8px;
      box-sizing: border-box;
      border: 2px solid rgba(255, 255, 255, 0.6);
    }

    /* Frente da carta (virada) */
    .card-front {
      background: linear-gradient(145deg, #ffffff, #f3edfa);
      color: #3d2a5c;
      transform: rotateY(180deg);
      font-weight: 600;
      font-size: 0.9rem;
      line-height: 1.3;
    }

    .card-front .emoji {
      font-size: 3.2rem;
      margin-bottom: 4px;
      line-height: 1.2;
    }

    .card-front .name {
      font-size: 0.75rem;
      font-weight: 700;
      color: #2d1b42;
      text-align: center;
      word-break: break-word;
      max-width: 90%;
    }

    .card-front .area {
      font-size: 0.6rem;
      font-weight: 400;
      color: #6b4d8a;
      background: rgba(91, 58, 138, 0.10);
      padding: 2px 10px;
      border-radius: 30px;
      margin-top: 2px;
    }

    /* Verso da carta (costas) */
    .card-back {
      background: linear-gradient(145deg, #6b4d8a, #4d2e70);
      transform: rotateY(0deg);
      color: white;
      border-color: #8b6aaa;
      font-size: 2.8rem;
      font-weight: bold;
      box-shadow: inset 0 -4px 0 #3a1f55;
    }

    .card-back::after {
      content: "🔬";
      font-size: 2.6rem;
      opacity: 0.9;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
    }

    /* Carta combinada (match) - efeito especial */
    .card.matched .card-front {
      border-color: #8bc34a;
      box-shadow: 0 0 0 3px #8bc34a88, inset 0 0 0 2px #8bc34a55;
      background: linear-gradient(145deg, #f5fff0, #e8f5e0);
    }

    .card.matched .card-front .name {
      color: #2e5e1e;
    }

    /* Botão reiniciar */
    .btn-reset {
      display: block;
      width: fit-content;
      margin: 0 auto;
      background: linear-gradient(145deg, #5b3a8a, #3d2a5c);
      color: white;
      border: none;
      padding: 14px 48px;
      border-radius: 60px;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 0 #281b3a, 0 6px 20px rgba(0, 0, 0, 0.2);
      transition: all 0.1s ease;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 4px;
    }

    .btn-reset:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #281b3a;
    }

    .btn-reset:hover {
      background: linear-gradient(145deg, #6b4d8a, #4d2e70);
    }

    /* Mensagem de vitória */
    .victory-message {
      text-align: center;
      font-size: 1.5rem;
      font-weight: 700;
      color: #2e5e1e;
      background: #e8f5e0;
      padding: 12px 20px;
      border-radius: 60px;
      margin-top: 16px;
      border: 2px solid #8bc34a;
      display: none;
      animation: pulse 1.2s infinite alternate;
    }

    .victory-message.show {
      display: block;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.02); }
    }

    /* Responsividade */
    @media (max-width: 600px) {
      .container {
        padding: 20px 14px 25px;
      }
      h1 {
        font-size: 1.6rem;
      }
      .memory-grid {
        gap: 10px;
      }
      .card-front .emoji {
        font-size: 2.4rem;
      }
      .card-front .name {
        font-size: 0.65rem;
      }
      .card-front .area {
        font-size: 0.5rem;
      }
      .card-back::after {
        font-size: 2rem;
      }
      .stats {
        padding: 10px 14px;
        font-size: 0.85rem;
      }
      .btn-reset {
        padding: 12px 32px;
        font-size: 1rem;
      }
    }

    @media (max-width: 420px) {
      .memory-grid {
        gap: 6px;
      }
      .card-front .emoji {
        font-size: 1.8rem;
      }
      .card-front .name {
        font-size: 0.5rem;
      }
      .card-front .area {
        font-size: 0.4rem;
        padding: 1px 6px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>
    👩‍🔬 Mulheres na Ciência
    <span>Jogo da Memória</span>
  </h1>
  <p class="subtitle">Encontre os pares das cientistas que mudaram o mundo</p>

  <!-- Estatísticas -->
  <div class="stats">
    <div class="stat-item">
      <span class="icon">🧩</span>
      Pares encontrados:
      <span class="value" id="pairsFound">0</span>
      <span style="font-weight:400; margin-left:2px;">/ 8</span>
    </div>
    <div class="stat-item">
      <span class="icon">🔄</span>
      Tentativas:
      <span class="value" id="attempts">0</span>
    </div>
  </div>

  <!-- Grid do jogo -->
  <div class="memory-grid" id="memoryGrid"></div>

  <!-- Botão reiniciar -->
  <button class="btn-reset" id="resetBtn">🔄 Novo Jogo</button>

  <!-- Mensagem de vitória -->
  <div class="victory-message" id="victoryMessage">
    🎉 Parabéns! Você encontrou todas as cientistas! 🎉
  </div>
</div>

<script>
  (function() {
    // ---------- DADOS DAS CIENTISTAS ----------
    const SCIENTISTS = [
      { id: 1, name: 'Marie Curie', emoji: '⚛️', area: 'Física / Química' },
      { id: 2, name: 'Ada Lovelace', emoji: '💻', area: 'Computação' },
      { id: 3, name: 'Rosalind Franklin', emoji: '🧬', area: 'Biologia' },
      { id: 4, name: 'Katherine Johnson', emoji: '🚀', area: 'Matemática' },
      { id: 5, name: 'Jane Goodall', emoji: '🐒', area: 'Primatologia' },
      { id: 6, name: 'Mae Jemison', emoji: '👩‍🚀', area: 'Astronauta' },
      { id: 7, name: 'Vera Rubin', emoji: '🌌', area: 'Astronomia' },
      { id: 8, name: 'Grace Hopper', emoji: '🖥️', area: 'Computação' }
    ];

    // Cada carta terá um par (duplicamos os dados)
    const PAIRS_COUNT = SCIENTISTS.length; // 8
    const TOTAL_CARDS = PAIRS_COUNT * 2;    // 16

    // Estado do jogo
    let cards = [];
    let flippedCards = [];
    let matchedPairs = 0;
    let attempts = 0;
    let lockBoard = false;
    let timeoutId = null;

    // Elementos DOM
    const grid = document.getElementById('memoryGrid');
    const pairsSpan = document.getElementById('pairsFound');
    const attemptsSpan = document.getElementById('attempts');
    const victoryMsg = document.getElementById('victoryMessage');
    const resetBtn = document.getElementById('resetBtn');

    // ---------- FUNÇÕES AUXILIARES ----------
    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // Cria o array de cartas (cada par aparece duas vezes)
    function buildCardDeck() {
      const deck = [];
      SCIENTISTS.forEach((scientist, index) => {
        // Cada cientista gera duas cartas (par)
        deck.push({
          id: index,           // identificador do par
          scientistId: scientist.id,
          name: scientist.name,
          emoji: scientist.emoji,
          area: scientist.area,
          matched: false,
          flipped: false,
          element: null
        });
        deck.push({
          id: index,
          scientistId: scientist.id,
          name: scientist.name,
          emoji: scientist.emoji,
          area: scientist.area,
          matched: false,
          flipped: false,
          element: null
        });
      });
      return shuffleArray(deck);
    }

    // Atualiza os contadores na tela
    function updateStats() {
      pairsSpan.textContent = matchedPairs;
      attemptsSpan.textContent = attempts;
    }

    // Verifica se o jogo acabou
    function checkVictory() {
      if (matchedPairs === PAIRS_COUNT) {
        victoryMsg.classList.add('show');
      } else {
        victoryMsg.classList.remove('show');
      }
    }

    // Reseta o estado do jogo (mantém os dados, mas reinicia)
    function resetGame() {
      // Cancela qualquer timeout pendente
      if (timeoutId) {
        clearTimeout(timeoutId);
        timeoutId = null;
      }
      // Reseta variáveis
      flippedCards = [];
      matchedPairs = 0;
      attempts = 0;
      lockBoard = false;
      victoryMsg.classList.remove('show');

      // Recria o baralho e renderiza
      cards = buildCardDeck();
      renderGrid();

      // Atualiza estatísticas
      updateStats();
    }

    // Renderiza o grid com base no array cards
    function renderGrid() {
      grid.innerHTML = '';
      cards.forEach((card, index) => {
        const cardDiv = document.createElement('div');
        cardDiv.className = 'card';
        if (card.matched) cardDiv.classList.add('matched');
        if (card.flipped) cardDiv.classList.add('flipped');

        // Inner
        const inner = document.createElement('div');
        inner.className = 'card-inner';

        // Frente (conteúdo)
        const front = document.createElement('div');
        front.className = 'card-front';
        front.innerHTML = `
          <div class="emoji">${card.emoji}</div>
          <div class="name">${card.name}</div>
          <div class="area">${card.area}</div>
        `;

        // Verso (costas)
        const back = document.createElement('div');
        back.className = 'card-back';

        inner.appendChild(front);
        inner.appendChild(back);
        cardDiv.appendChild(inner);

        // Armazena referência no objeto card
        card.element = cardDiv;
        card.flipped = false; // garantia

        // Evento de clique
        cardDiv.addEventListener('click', () => handleCardClick(index));

        grid.appendChild(cardDiv);
      });
    }

    // ---------- LÓGICA DO JOGO ----------
    function handleCardClick(index) {
      const card = cards[index];

      // Impedir ações se:
      // - board bloqueado
      // - carta já combinada
      // - carta já virada
      // - já tem duas cartas viradas (aguardando)
      if (lockBoard) return;
      if (card.matched) return;
      if (card.flipped) return;
      if (flippedCards.length >= 2) return;

      // Vira a carta
      flipCard(index);

      // Adiciona à lista de viradas
      flippedCards.push(index);

      // Se temos duas cartas viradas, verifica par
      if (flippedCards.length === 2) {
        lockBoard = true;
        attempts++;
        updateStats();
        checkMatch();
      } else {
        // Apenas uma carta virada, nada mais
        // (atualiza tentativas apenas quando duas são viradas)
      }
    }

    function flipCard(index) {
      const card = cards[index];
      if (card.flipped) return;
      card.flipped = true;
      if (card.element) {
        card.element.classList.add('flipped');
      }
    }

    function unflipCard(index) {
      const card = cards[index];
      if (!card.flipped) return;
      card.flipped = false;
      if (card.element) {
        card.element.classList.remove('flipped');
      }
    }

    function checkMatch() {
      const idx1 = flippedCards[0];
      const idx2 = flippedCards[1];
      const card1 = cards[idx1];
      const card2 = cards[idx2];

      // Verifica se é um par (mesmo id do par)
      const isMatch = (card1.id === card2.id);

      if (isMatch) {
        // Marca como combinadas
        card1.matched = true;
        card2.matched = true;
        if (card1.element) card1.element.classList.add('matched');
        if (card2.element) card2.element.classList.add('matched');

        matchedPairs++;
        updateStats();
        checkVictory();

        // Limpa cartas viradas e destrava
        flippedCards = [];
        lockBoard = false;
      } else {
        // Não é par: desvira após um tempo
        timeoutId = setTimeout(() => {
          // Desvira as duas cartas (se ainda não foram modificadas)
          // Mas antes verifica se ainda estão viradas (não foram combinadas)
          if (!cards[idx1].matched && cards[idx1].flipped) {
            unflipCard(idx1);
          }
          if (!cards[idx2].matched && cards[idx2].flipped) {
            unflipCard(idx2);
          }
          // Limpa lista e destrava
          flippedCards = [];
          lockBoard = false;
          timeoutId = null;
        }, 700);
      }
    }

    // ---------- INICIALIZAÇÃO ----------
    function initGame() {
      cards = buildCardDeck();
      renderGrid();
      matchedPairs = 0;
      attempts = 0;
      flippedCards = [];
      lockBoard = false;
      if (timeoutId) {
        clearTimeout(timeoutId);
        timeoutId = null;
      }
      victoryMsg.classList.remove('show');
      updateStats();
    }

    // Evento do botão reiniciar
    resetBtn.addEventListener('click', () => {
      // Se houver timeout pendente, limpa
      if (timeoutId) {
        clearTimeout(timeoutId);
        timeoutId = null;
        lockBoard = false;
        // Desvira todas as cartas que estão viradas e não combinadas
        cards.forEach((card, idx) => {
          if (card.flipped && !card.matched) {
            unflipCard(idx);
          }
        });
        flippedCards = [];
      }
      // Reinicia o jogo
      initGame();
    });

    // Inicia pela primeira vez
    initGame();
  })();
</script>

</body>
</html>
