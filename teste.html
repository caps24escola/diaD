<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Memória: Mulheres na Ciência</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1a1c29, #3a2352);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 8px;
      color: #f39c12;
    }

    p.subtitle {
      font-size: 1rem;
      opacity: 0.9;
    }

    .stats {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      font-weight: bold;
      font-size: 1.1rem;
      background: rgba(255, 255, 255, 0.1);
      padding: 10px 20px;
      border-radius: 20px;
      backdrop-filter: blur(5px);
    }

    .memory-board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      max-width: 800px;
      width: 100%;
      perspective: 1000px;
    }

    @media (max-width: 650px) {
      .memory-board {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .card {
      height: 140px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s ease;
      cursor: pointer;
      border-radius: 12px;
    }

    .card.flip {
      transform: rotateY(180deg);
    }

    .front, .back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .front {
      background: #2c3e50;
      border: 2px solid #f39c12;
      color: #f39c12;
      font-size: 2.5rem;
    }

    .back {
      background: #ffffff;
      color: #2c3e50;
      transform: rotateY(180deg);
      border: 2px solid #8e44ad;
    }

    .back h3 {
      font-size: 0.95rem;
      margin-bottom: 5px;
      color: #8e44ad;
    }

    .back p {
      font-size: 0.75rem;
      line-height: 1.2;
    }

    .card.matched .back {
      border-color: #2ecc71;
      background-color: #e8f8f5;
    }

    .controls {
      margin-top: 25px;
    }

    button {
      background-color: #f39c12;
      color: #1a1c29;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    button:hover {
      background-color: #e67e22;
      transform: scale(1.05);
    }

    .win-message {
      display: none;
      margin-top: 15px;
      font-size: 1.2rem;
      color: #2ecc71;
      font-weight: bold;
      text-align: center;
      animation: fadeIn 0.5s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>

  <header>
    <h1>👩‍🔬 Mulheres na Ciência</h1>
    <p class="subtitle">Dia D da Tecnologia — Encontre os pares e conheça as cientistas!</p>
  </header>

  <div class="stats">
    <span>Tentativas: <span id="moves">0</span></span>
    <span>Pares: <span id="matches">0</span>/6</span>
  </div>

  <main class="memory-board" id="board"></main>

  <div class="win-message" id="winMessage">
    🎉 Sensacional! Você concluiu o desafio e conheceu grandes pioneiras da história!
  </div>

  <div class="controls">
    <button onclick="resetGame()">Reiniciar Jogo</button>
  </div>

  <script>
    const scientists = [
      { name: "Marie Curie", desc: "Pioneira na radioatividade e única pessoa a ganhar Nobel em duas ciências diferentes." },
      { name: "Ada Lovelace", desc: "Matemática e considerada a primeira programadora de computadores da história." },
      { name: "Rosalind Franklin", desc: "Fundamental para a descoberta da estrutura em dupla hélice do DNA." },
      { name: "Katherine Johnson", desc: "Matemática da NASA cujos cálculos foram cruciais para as missões Apollo." },
      { name: "Margaret Hamilton", desc: "Engenheira que liderou o desenvolvimento do software de voo da nave Apollo." },
      { name: "Enedina Marques", desc: "Primeira engenheira negra do Brasil e pioneira da construção civil no país." }
    ];

    let cardsData = [];
    let hasFlippedCard = false;
    let lockBoard = false;
    let firstCard, secondCard;
    let moves = 0;
    let matches = 0;

    function initGame() {
      const board = document.getElementById('board');
      board.innerHTML = '';
      moves = 0;
      matches = 0;
      document.getElementById('moves').textContent = moves;
      document.getElementById('matches').textContent = matches;
      document.getElementById('winMessage').style.display = 'none';

      // Duplica os elementos para formar os pares e embaralha
      cardsData = [...scientists, ...scientists];
      cardsData.sort(() => Math.random() - 0.5);

      cardsData.forEach((scientist) => {
        const card = document.createElement('div');
        card.classList.add('card');
        card.dataset.name = scientist.name;

        card.innerHTML = `
          <div class="front">⚛️</div>
          <div class="back">
            <h3>${scientist.name}</h3>
            <p>${scientist.desc}</p>
          </div>
        `;

        card.addEventListener('click', flipCard);
        board.appendChild(card);
      });
    }

    function flipCard() {
      if (lockBoard) return;
      if (this === firstCard) return;

      this.classList.add('flip');

      if (!hasFlippedCard) {
        hasFlippedCard = true;
        firstCard = this;
        return;
      }

      secondCard = this;
      moves++;
      document.getElementById('moves').textContent = moves;

      checkForMatch();
    }

    function checkForMatch() {
      let isMatch = firstCard.dataset.name === secondCard.dataset.name;
      isMatch ? disableCards() : unflipCards();
    }

    function disableCards() {
      firstCard.classList.add('matched');
      secondCard.classList.add('matched');

      firstCard.removeEventListener('click', flipCard);
      secondCard.removeEventListener('click', flipCard);

      matches++;
      document.getElementById('matches').textContent = matches;

      if (matches === scientists.length) {
        document.getElementById('winMessage').style.display = 'block';
      }

      resetBoard();
    }

    function unflipCards() {
      lockBoard = true;

      setTimeout(() => {
        firstCard.classList.remove('flip');
        secondCard.classList.remove('flip');
        resetBoard();
      }, 1000);
    }

    function resetBoard() {
      [hasFlippedCard, lockBoard] = [false, false];
      [firstCard, secondCard] = [null, null];
    }

    function resetGame() {
      resetBoard();
      initGame();
    }

    initGame();
  </script>
</body>
</html>
