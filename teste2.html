<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galáxia das Mulheres na Ciência — Dia D Tecnologia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #05040f;
    --gold: #f4c95d;
    --violet: #b98bff;
    --ink: #f0eef7;
    --dim: #a29bc4;
  }
  html, body { margin:0; padding:0; background:var(--bg); overflow:hidden; height:100%; font-family:'Inter', sans-serif; }
  canvas { display:block; touch-action:none; }

  #hud {
    position:fixed; inset:0; pointer-events:none; z-index:5;
    font-family:'Inter', sans-serif;
  }
  #title-block {
    position:absolute; top:24px; left:24px; color:var(--ink);
    max-width:340px;
  }
  #title-block .eyebrow {
    font-size:11px; letter-spacing:0.18em; text-transform:uppercase;
    color:var(--gold); font-weight:600; margin-bottom:6px;
  }
  #title-block h1 {
    font-family:'Fraunces', serif; font-weight:600; font-size:26px;
    margin:0 0 6px 0; line-height:1.15; color:var(--ink);
  }
  #title-block p {
    font-size:12.5px; color:var(--dim); line-height:1.5; margin:0;
  }

  #legend {
    position:absolute; bottom:22px; left:24px; display:flex; flex-direction:column; gap:6px;
    background:rgba(10,8,25,0.45); border:1px solid rgba(244,201,93,0.15);
    padding:12px 14px; border-radius:10px; backdrop-filter: blur(6px);
  }
  #legend .row { display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--dim); }
  #legend .dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }

  #panel {
    position:absolute; bottom:22px; right:24px; width:320px;
    background:rgba(10,8,25,0.72); border:1px solid rgba(185,139,255,0.25);
    border-radius:14px; padding:18px 20px; color:var(--ink);
    backdrop-filter: blur(10px); transition:opacity 0.4s ease, transform 0.4s ease;
    opacity:0; transform:translateY(8px);
  }
  #panel.show { opacity:1; transform:translateY(0); }
  #panel .field { font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase; font-weight:600; margin-bottom:6px; }
  #panel h2 { font-family:'Fraunces', serif; font-size:20px; margin:0 0 4px 0; font-weight:600; }
  #panel .years { font-size:11.5px; color:var(--dim); margin-bottom:10px; }
  #panel p { font-size:13px; line-height:1.55; margin:0; color:#dcd8ef; }

  #vr-hint {
    position:absolute; top:24px; right:24px; color:var(--dim); font-size:11.5px;
    text-align:right; max-width:220px; line-height:1.5;
  }
  #vr-hint b { color:var(--gold); }

  /* VRButton gets injected by three.js — restyle it a bit */
  #VRButton {
    background: rgba(244,201,93,0.12) !important;
    border: 1px solid var(--gold) !important;
    color: var(--gold) !important;
    font-family:'Inter', sans-serif !important;
  }
</style>
</head>
<body>

<div id="hud">
  <div id="title-block">
    <div class="eyebrow">Dia D Tecnologia</div>
    <h1>Galáxia das Mulheres na Ciência</h1>
    <p>Cada estrela é uma cientista. Aponte e faça o gesto de pinça para revelar sua história — ou apenas observe: as informações vão passando sozinhas.</p>
  </div>
  <div id="vr-hint">Modo desktop: <b>clique</b> numa estrela.<br>No Quest 3S: <b>pinça</b> com a mão para selecionar.</div>
  <div id="legend"></div>
  <div id="panel"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { VRButton } from 'three/addons/webxr/VRButton.js';
import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
import { XRHandModelFactory } from 'three/addons/webxr/XRHandModelFactory.js';

/* ---------------------------------------------------------------
   DADOS — Mulheres na ciência
--------------------------------------------------------------- */
const FIELDS = {
  fisica:      { label: 'Física',        color: '#5aa9ff' },
  quimica:     { label: 'Química',       color: '#6fe3b4' },
  biologia:    { label: 'Biologia',      color: '#f4c95d' },
  matematica:  { label: 'Matemática/TI', color: '#c792ea' },
  astronomia:  { label: 'Astronomia',    color: '#7fd8e8' },
  medicina:    { label: 'Medicina',      color: '#ff8fa3' },
};

const WOMEN = [
  { name:'Marie Curie', years:'1867–1934', field:'fisica',
    bio:'Pioneira no estudo da radioatividade, foi a primeira pessoa a ganhar dois prêmios Nobel, em Física e em Química, abrindo caminho para gerações de cientistas.' },
  { name:'Ada Lovelace', years:'1815–1852', field:'matematica',
    bio:'Matemática britânica considerada autora do primeiro algoritmo destinado a ser processado por uma máquina, sendo vista como precursora da programação.' },
  { name:'Rosalind Franklin', years:'1920–1958', field:'quimica',
    bio:'Suas imagens de difração de raios X foram decisivas para desvendar a estrutura em dupla hélice do DNA, um marco da biologia molecular.' },
  { name:'Katherine Johnson', years:'1918–2020', field:'matematica',
    bio:'Matemática da NASA cujos cálculos de trajetória garantiram o sucesso de missões espaciais como a do Mercury-Atlas 6 e o programa Apollo.' },
  { name:'Chien-Shiung Wu', years:'1912–1997', field:'fisica',
    bio:'Física experimental que derrubou o princípio da conservação da paridade, um dos experimentos mais importantes da física do século XX.' },
  { name:'Grace Hopper', years:'1906–1992', field:'matematica',
    bio:'Almirante e cientista da computação que criou um dos primeiros compiladores, tornando a programação mais acessível através de linguagens legíveis por humanos.' },
  { name:'Vera Rubin', years:'1928–2016', field:'astronomia',
    bio:'Astrônoma cujas observações das velocidades de rotação de galáxias forneceram evidências decisivas para a existência da matéria escura.' },
  { name:'Rita Levi-Montalcini', years:'1909–2012', field:'medicina',
    bio:'Neurologista que descobriu o fator de crescimento neural, revolucionando o entendimento sobre o desenvolvimento do sistema nervoso.' },
  { name:'Jocelyn Bell Burnell', years:'1943–', field:'astronomia',
    bio:'Detectou os primeiros sinais de pulsares durante seu doutorado, uma descoberta fundamental para a astrofísica moderna.' },
  { name:'Bertha Lutz', years:'1894–1976', field:'biologia',
    bio:'Bióloga e ativista brasileira, foi uma das pioneiras do feminismo no Brasil e participou da fundação das Nações Unidas defendendo direitos das mulheres.' },
  { name:'Mayana Zatz', years:'1947–', field:'biologia',
    bio:'Geneticista brasileira referência mundial em doenças neuromusculares e células-tronco, fundadora de um dos maiores centros de pesquisa genética do país.' },
  { name:'Jaqueline Goes de Jesus', years:'1985–', field:'biologia',
    bio:'Virologista brasileira que liderou a equipe que sequenciou o genoma do novo coronavírus na América Latina em tempo recorde, em 2020.' },
  { name:'Nise da Silveira', years:'1905–1999', field:'medicina',
    bio:'Psiquiatra brasileira que transformou o tratamento da saúde mental no país ao introduzir a arte como forma de terapia e defender práticas mais humanas.' },
  { name:'Graziela Barroso', years:'1912–2003', field:'biologia',
    bio:'Botânica brasileira que catalogou milhares de espécies da flora nacional, deixando um legado essencial para a preservação da biodiversidade do Brasil.' },
  { name:'Tu Youyou', years:'1930–', field:'quimica',
    bio:'Farmacêutica chinesa que descobriu a artemisinina, tratamento que salvou milhões de vidas contra a malária, rendendo-lhe o prêmio Nobel de Medicina.' },
];

/* ---------------------------------------------------------------
   CENA BÁSICA
--------------------------------------------------------------- */
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05040f, 0.011);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 200);
camera.position.set(0, 9, 22);

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer, { optionalFeatures: ['hand-tracking', 'local-floor'] }));

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.35;
controls.minDistance = 4;
controls.maxDistance = 45;

scene.add(new THREE.AmbientLight(0x8888ff, 0.4));
const coreLight = new THREE.PointLight(0xffd27a, 3, 40);
coreLight.position.set(0,0,0);
scene.add(coreLight);

/* ---------------------------------------------------------------
   GALÁXIA DE PARTÍCULAS (espiral)
--------------------------------------------------------------- */
function buildGalaxy(){
  const count = 16000, radius = 15, branches = 5, spin = 1.15, randomness = 0.42, randomnessPower = 3;
  const insideColor = new THREE.Color('#ffd27a');
  const outsideColor = new THREE.Color('#3f6bd6');

  const geo = new THREE.BufferGeometry();
  const positions = new Float32Array(count*3);
  const colors = new Float32Array(count*3);

  for(let i=0;i<count;i++){
    const i3 = i*3;
    const r = Math.random()*radius;
    const branchAngle = (i % branches) / branches * Math.PI * 2;
    const spinAngle = r * spin;

    const rx = Math.pow(Math.random(), randomnessPower) * (Math.random()<0.5?1:-1) * randomness * r;
    const ry = Math.pow(Math.random(), randomnessPower) * (Math.random()<0.5?1:-1) * randomness * r * 0.4;
    const rz = Math.pow(Math.random(), randomnessPower) * (Math.random()<0.5?1:-1) * randomness * r;

    positions[i3]   = Math.cos(branchAngle + spinAngle) * r + rx;
    positions[i3+1] = ry;
    positions[i3+2] = Math.sin(branchAngle + spinAngle) * r + rz;

    const mixed = insideColor.clone().lerp(outsideColor, r/radius);
    colors[i3] = mixed.r; colors[i3+1] = mixed.g; colors[i3+2] = mixed.b;
  }

  geo.setAttribute('position', new THREE.BufferAttribute(positions,3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors,3));

  const mat = new THREE.PointsMaterial({
    size:0.09, sizeAttenuation:true, depthWrite:false,
    blending:THREE.AdditiveBlending, vertexColors:true, transparent:true, opacity:0.9
  });

  const points = new THREE.Points(geo, mat);
  scene.add(points);
  return points;
}
const galaxy = buildGalaxy();

/* ---------------------------------------------------------------
   TEXTURA DE CANVAS PARA LABEL / PAINEL
--------------------------------------------------------------- */
function makeLabelSprite(text, color){
  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 64;
  const ctx = canvas.getContext('2d');
  ctx.font = '600 30px Inter, sans-serif';
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.shadowColor = 'rgba(0,0,0,0.8)';
  ctx.shadowBlur = 6;
  ctx.fillText(text, 128, 40);
  const tex = new THREE.CanvasTexture(canvas);
  const mat = new THREE.SpriteMaterial({ map:tex, transparent:true, depthWrite:false });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(2.2, 0.55, 1);
  return sprite;
}

/* ---------------------------------------------------------------
   ESTRELAS DAS CIENTISTAS
--------------------------------------------------------------- */
const starGroup = new THREE.Group();
scene.add(starGroup);
const starMeshes = [];

WOMEN.forEach((woman, i) => {
  const field = FIELDS[woman.field];
  const branch = i % 5;
  const rNorm = i / WOMEN.length;
  const r = 2.2 + rNorm * 12.5;
  const angle = (branch/5)*Math.PI*2 + r*1.15;
  const y = (Math.sin(i*12.9) * 0.6);

  const geo = new THREE.SphereGeometry(0.22, 20, 20);
  const mat = new THREE.MeshStandardMaterial({
    color: field.color, emissive: field.color, emissiveIntensity: 1.4, roughness:0.35
  });
  const star = new THREE.Mesh(geo, mat);
  star.position.set(Math.cos(angle)*r, y, Math.sin(angle)*r);
  star.userData = woman;
  starGroup.add(star);
  starMeshes.push(star);

  const glow = new THREE.PointLight(field.color, 0.6, 3);
  star.add(glow);

  const label = makeLabelSprite(woman.name, field.color);
  label.position.set(0, 0.55, 0);
  star.add(label);
});

/* ---------------------------------------------------------------
   LEGENDA HTML (visível em desktop)
--------------------------------------------------------------- */
const legendEl = document.getElementById('legend');
Object.values(FIELDS).forEach(f=>{
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = `<span class="dot" style="background:${f.color}"></span>${f.label}`;
  legendEl.appendChild(row);
});

/* ---------------------------------------------------------------
   PAINEL DE INFORMAÇÃO (3D sprite, visível em VR + HTML em desktop)
--------------------------------------------------------------- */
const panelEl = document.getElementById('panel');

function drawInfoCanvas(woman){
  const field = FIELDS[woman.field];
  const canvas = document.createElement('canvas');
  canvas.width = 900; canvas.height = 480;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = 'rgba(8,6,20,0.86)';
  roundRect(ctx, 0,0, canvas.width, canvas.height, 28); ctx.fill();
  ctx.strokeStyle = field.color; ctx.lineWidth = 3;
  roundRect(ctx, 3,3, canvas.width-6, canvas.height-6, 26); ctx.stroke();

  ctx.fillStyle = field.color;
  ctx.font = '600 26px Inter, sans-serif';
  ctx.fillText(field.label.toUpperCase(), 48, 70);

  ctx.fillStyle = '#f0eef7';
  ctx.font = '600 54px Fraunces, serif';
  ctx.fillText(woman.name, 48, 150);

  ctx.fillStyle = '#a29bc4';
  ctx.font = '400 26px Inter, sans-serif';
  ctx.fillText(woman.years, 48, 195);

  ctx.fillStyle = '#dcd8ef';
  ctx.font = '400 30px Inter, sans-serif';
  wrapText(ctx, woman.bio, 48, 260, canvas.width-96, 42);

  return canvas;
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function wrapText(ctx, text, x, y, maxWidth, lineHeight){
  const words = text.split(' ');
  let line = '';
  for(let n=0;n<words.length;n++){
    const test = line + words[n] + ' ';
    if(ctx.measureText(test).width > maxWidth && n>0){
      ctx.fillText(line, x, y); line = words[n]+' '; y += lineHeight;
    } else { line = test; }
  }
  ctx.fillText(line, x, y);
}

let infoSprite = null;
function showInfo(star){
  const woman = star.userData;
  const field = FIELDS[woman.field];

  // Desktop HTML panel
  panelEl.innerHTML = `
    <div class="field" style="color:${field.color}">${field.label}</div>
    <h2>${woman.name}</h2>
    <div class="years">${woman.years}</div>
    <p>${woman.bio}</p>`;
  panelEl.classList.add('show');

  // 3D sprite panel (visible in VR)
  if(infoSprite){ scene.remove(infoSprite); }
  const canvas = drawInfoCanvas(woman);
  const tex = new THREE.CanvasTexture(canvas);
  const mat = new THREE.SpriteMaterial({ map:tex, transparent:true, depthWrite:false });
  infoSprite = new THREE.Sprite(mat);
  infoSprite.scale.set(3.6, 1.92, 1);
  const p = star.getWorldPosition(new THREE.Vector3());
  infoSprite.position.set(p.x*1.15, p.y + 1.1, p.z*1.15);
  scene.add(infoSprite);

  activeStar = star;
  lastInteraction = performance.now();
}

/* ---------------------------------------------------------------
   SELEÇÃO — clique (desktop) e pinça (VR)
--------------------------------------------------------------- */
const raycaster = new THREE.Raycaster();
let activeStar = null;
let lastInteraction = 0;

// Desktop click
renderer.domElement.addEventListener('click', (e)=>{
  const mouse = new THREE.Vector2(
    (e.clientX/window.innerWidth)*2-1,
    -(e.clientY/window.innerHeight)*2+1
  );
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(starMeshes);
  if(hits.length) showInfo(hits[0].object);
});

// VR controllers / hand pinch (fires 'select' on pinch when hand-tracking is used)
function setupXRInput(index){
  const controller = renderer.xr.getController(index);
  controller.addEventListener('selectstart', ()=>{
    const tempMatrix = new THREE.Matrix4();
    tempMatrix.identity().extractRotation(controller.matrixWorld);
    raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
    raycaster.ray.direction.set(0,0,-1).applyMatrix4(tempMatrix);
    const hits = raycaster.intersectObjects(starMeshes);
    if(hits.length) showInfo(hits[0].object);
  });
  scene.add(controller);

  const grip = renderer.xr.getControllerGrip(index);
  grip.add(new XRControllerModelFactory().createControllerModel(grip));
  scene.add(grip);

  const hand = renderer.xr.getHand(index);
  hand.add(new XRHandModelFactory().createHandModel(hand, 'mesh'));
  scene.add(hand);
}
setupXRInput(0);
setupXRInput(1);

/* ---------------------------------------------------------------
   AUTOPLAY — as informações vão passando sozinhas
--------------------------------------------------------------- */
let autoIndex = 0;
const AUTOPLAY_INTERVAL = 9000;
const IDLE_BEFORE_RESUME = 12000;

setInterval(()=>{
  const idle = performance.now() - lastInteraction;
  if(idle > IDLE_BEFORE_RESUME || lastInteraction === 0){
    showInfo(starMeshes[autoIndex]);
    lastInteraction = 0; // keep as "autoplay", not user interaction
    autoIndex = (autoIndex+1) % starMeshes.length;
  }
}, AUTOPLAY_INTERVAL);

// kick off immediately
showInfo(starMeshes[0]);
autoIndex = 1;

/* ---------------------------------------------------------------
   LOOP
--------------------------------------------------------------- */
const clock = new THREE.Clock();
renderer.setAnimationLoop(()=>{
  const t = clock.getElapsedTime();
  galaxy.rotation.y = t * 0.02;
  starGroup.rotation.y = t * 0.02;

  starMeshes.forEach((s,i)=>{
    const pulse = 1 + Math.sin(t*2 + i)*0.08;
    s.scale.setScalar(s===activeStar ? pulse*1.6 : pulse);
  });

  if(infoSprite && activeStar){
    infoSprite.lookAt(camera.position);
  }

  controls.update();
  renderer.render(scene, camera);
});

window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
