<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galáxia: Mulheres na Ciência</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <script>
    // Componente interativo ao pinçar/clicar nas estrelas da galáxia
    AFRAME.registerComponent('scientist-node', {
      schema: {
        name: {type: 'string', default: ''},
        area: {type: 'string', default: ''},
        fact: {type: 'string', default: ''}
      },
      init: function () {
        const el = this.el;
        const data = this.data;

        el.addEventListener('click', function () {
          const titleText = document.querySelector('#info-title');
          const areaText = document.querySelector('#info-area');
          const factText = document.querySelector('#info-fact');

          titleText.setAttribute('value', data.name);
          areaText.setAttribute('value', 'Area: ' + data.area);
          factText.setAttribute('value', data.fact);
        });
      }
    });
  </script>
</head>
<body>
  <a-scene webxr="optionalFeatures: hand-tracking">
    
    <a-sky color="#030210"></a-sky>
    <a-light type="ambient" color="#8888ff" intensity="0.7"></a-light>
    <a-light type="point" position="0 2 0" color="#ffffff" intensity="1.2"></a-light>

    <a-entity id="leftHand" hand-tracking-controls="hand: left" raycaster="objects: .raycastable; showLine: true" cursor></a-entity>
    <a-entity id="rightHand" hand-tracking-controls="hand: right" raycaster="objects: .raycastable; showLine: true" cursor></a-entity>

    <a-entity camera look-controls position="0 1.6 0">
      <a-cursor raycaster="objects: .raycastable" color="#ff4081"></a-cursor>
    </a-entity>

    <a-entity id="galaxy-center" animation="property: rotation; to: 0 360 0; loop: true; dur: 50000; easing: linear">
      
      <a-sphere position="0 1.2 -3" radius="0.5" color="#ffd700" shader="flat" 
                animation="property: scale; dir: alternate; dur: 2000; to: 1.2 1.2 1.2; loop: true"></a-sphere>

      <a-entity position="2 1.8 -2.5">
        <a-sphere class="raycastable" radius="0.25" color="#ff4081" 
                  scientist-node="name: Marie Curie; area: Fisica e Quimica; fact: Primeiras pessoa a ganhar dois Premios Nobel em areas distintas. Descobriu os elementos Polonio e Radio."></a-sphere>
        <a-text value="Marie Curie" position="0 0.4 0" align="center" scale="0.6 0.6 0.6" color="#ffffff"></a-text>
      </a-entity>

      <a-entity position="-2 1.2 -2">
        <a-sphere class="raycastable" radius="0.25" color="#00e676" 
                  scientist-node="name: Ada Lovelace; area: Computacao; fact: Criou o primeiro algoritmo da historia para ser processado por uma maquina."></a-sphere>
        <a-text value="Ada Lovelace" position="0 0.4 0" align="center" scale="0.6 0.6 0.6" color="#ffffff"></a-text>
      </a-entity>

      <a-entity position="1.5 2.5 -3.5">
        <a-sphere class="raycastable" radius="0.25" color="#00b0ff" 
                  scientist-node="name: Katherine Johnson; area: Matematica e Aeroespacial; fact: Calculou as trajetorias de voo cruciais para as missoes Apollo e Mercury da NASA."></a-sphere>
        <a-text value="Katherine Johnson" position="0 0.4 0" align="center" scale="0.6 0.6 0.6" color="#ffffff"></a-text>
      </a-entity>

      <a-entity position="-1.8 0.5 -3">
        <a-sphere class="raycastable" radius="0.25" color="#e040fb" 
                  scientist-node="name: Rosalind Franklin; area: Biofisica; fact: A Imagem 51 tirada por ela foi decisiva para a descoberta da estrutura em helice do DNA."></a-sphere>
        <a-text value="Rosalind Franklin" position="0 0.4 0" align="center" scale="0.6 0.6 0.6" color="#ffffff"></a-text>
      </a-entity>

      <a-entity position="0 0.2 -4">
        <a-sphere class="raycastable" radius="0.25" color="#ffab00" 
                  scientist-node="name: Bertha Lutz; area: Biologia e Zoologia; fact: Biologa brasileira, referencia no estudo de anfibios e lider na luta pelos direitos das mulheres."></a-sphere>
        <a-text value="Bertha Lutz" position="0 0.4 0" align="center" scale="0.6 0.6 0.6" color="#ffffff"></a-text>
      </a-entity>

    </a-entity>

    <a-entity id="info-panel" position="0 1.6 -1.8">
      <a-plane width="2.2" height="1.1" color="#0a0a1a" opacity="0.85" material="transparent: true">
        <a-text value="GALAXIA: MULHERES NA CIENCIA" align="center" position="0 0.38 0.01" color="#ffeb3b" width="2.5"></a-text>
        <a-text id="info-title" value="Pince uma estrela para explorar" align="center" position="0 0.2 0.01" color="#ffffff" width="2.8"></a-text>
        <a-text id="info-area" value="Use os gestos de pinca do Meta Quest 3S" align="center" position="0 0.02 0.01" color="#80d8ff" width="2.2"></a-text>
        <a-text id="info-fact" value="" align="center" position="0 -0.22 0.01" color="#e0e0e0" width="2.0" wrap-count="32"></a-text>
      </a-plane>
    </a-entity>

  </a-scene>
</body>
</html>
