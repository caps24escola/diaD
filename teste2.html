<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Galáxia das Cientistas</title>
    <style>
        /* Reset e estilo base */
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            background-color: black;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Renderizador CSS2D ocupa toda a tela, por cima do WebGL */
        #label-renderer {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            /* permite cliques apenas nos labels */;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Cada label é um cartão clicável */
        .label-card {
            pointer-events: auto;
            cursor: pointer;
            background: rgba(20, 20, 40, 0.7);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 12px 18px;
            text-align: center;
            box-shadow: 0 0 30px rgba(100, 150, 255, 0.2);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            color: white;
            min-width: 120px;
            max-width: 180px;
            will-change: transform;
            font-size: 14px;
            line-height: 1.4;
        }

        .label-card:hover {
            transform: scale(1.08);
            box-shadow: 0 0 50px rgba(100, 200, 255, 0.5);
            border-color: rgba(255, 255, 255, 0.6);
        }

        .label-card .nome {
            font-weight: bold;
            font-size: 1.2em;
            color: #aaccff;
            text-shadow: 0 0 10px rgba(100, 150, 255, 0.5);
        }

        .label-card .area {
            font-size: 0.85em;
            opacity: 0.8;
            margin-top: 4px;
            color: #d0e0ff;
        }

        /* Modal de detalhes */
        #modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            pointer-events: auto;
            animation: fadeIn 0.3s ease;
        }

        #modal-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-content {
            background: rgba(10, 10, 30, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 32px;
            padding: 40px 48px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 0 80px rgba(50, 100, 255, 0.3);
            color: white;
            text-align: center;
            position: relative;
        }

        .modal-content .foto-placeholder {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: radial-gradient(circle, #2a3a6a, #0a0a1a);
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            border: 2px solid #4a6a9a;
            box-shadow: 0 0 40px rgba(70, 130, 255, 0.3);
        }

        .modal-content h2 {
            font-size: 2em;
            margin: 0 0 8px;
            color: #aaccff;
        }

        .modal-content .area-detalhe {
            font-size: 1.1em;
            opacity: 0.8;
            margin-bottom: 16px;
            color: #b0c8f0;
        }

        .modal-content .bio {
            font-size: 1em;
            line-height: 1.6;
            opacity: 0.9;
            margin-bottom: 24px;
        }

        .modal-content .fechar {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 40px;
            padding: 10px 28px;
            color: white;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.2s;
            pointer-events: auto;
        }

        .modal-content .fechar:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Instrução no canto */
        #instrucao {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            padding: 10px 24px;
            border-radius: 40px;
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: none;
            z-index: 500;
            text-align: center;
            white-space: nowrap;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        @media (max-width: 600px) {
            .label-card {
                font-size: 11px;
                padding: 8px 12px;
                min-width: 80px;
            }
            .modal-content {
                padding: 28px 20px;
            }
            #instrucao {
                font-size: 0.7em;
                padding: 6px 16px;
                bottom: 16px;
                white-space: normal;
            }
        }
    </style>
</head>
<body>

    <!-- Instrução -->
    <div id="instrucao">👆 Toque / pinça em um cartão para conhecer a cientista</div>

    <!-- Modal -->
    <div id="modal-overlay">
        <div class="modal-content">
            <div class="foto-placeholder" id="modal-foto">👩‍🔬</div>
            <h2 id="modal-nome">Nome</h2>
            <div class="area-detalhe" id="modal-area">Área</div>
            <div class="bio" id="modal-bio">Biografia</div>
            <button class="fechar" id="modal-fechar">✕ Fechar</button>
        </div>
    </div>

    <!-- Renderizador CSS2D será inserido aqui pelo Three.js -->
    <div id="label-renderer"></div>

    <!-- Import Maps e código principal -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        // ----- IMPORTS -----
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // ----- DADOS DAS CIENTISTAS -----
        const cientistas = [{
            id: 0,
            nome: 'Marie Curie',
            area: 'Física e Química',
            bio: 'Pioneira no estudo da radioatividade, descobriu os elementos polônio e rádio. Primeira mulher a ganhar um Nobel e a única a ganhar em duas áreas distintas (Física e Química).',
            emoji: '⚛️'
        }, {
            id: 1,
            nome: 'Ada Lovelace',
            area: 'Matemática',
            bio: 'Considerada a primeira programadora da história. Escreveu o primeiro algoritmo para ser processado por uma máquina, a Máquina Analítica de Charles Babbage.',
            emoji: '💻'
        }, {
            id: 2,
            nome: 'Rosalind Franklin',
            area: 'Química e Biofísica',
            bio: 'Seus dados de difração de raios X (Fotografia 51) foram fundamentais para a descoberta da estrutura em dupla hélice do DNA, embora seu papel tenha sido subestimado.',
            emoji: '🧬'
        }, {
            id: 3,
            nome: 'Katherine Johnson',
            area: 'Matemática e Física',
            bio: 'Matemática da NASA, calculou trajetórias de voo para as missões Mercury e Apollo, incluindo a Apollo 11. Sua história foi contada no filme "Estrelas Além do Tempo".',
            emoji: '🚀'
        }, {
            id: 4,
            nome: 'Vera Rubin',
            area: 'Astronomia',
            bio: 'Descobriu evidências da matéria escura ao observar as curvas de rotação de galáxias. Revolucionou a astrofísica e abriu caminho para novas teorias cosmológicas.',
            emoji: '🌌'
        }, {
            id: 5,
            nome: 'Hypatia',
            area: 'Matemática e Astronomia',
            bio: 'Filósofa e matemática do Egito antigo, foi uma das primeiras mulheres cientistas da história. Ensinou e escreveu sobre astronomia, matemática e filosofia.',
            emoji: '📐'
        }, {
            id: 6,
            nome: 'Grace Hopper',
            area: 'Ciência da Computação',
            bio: 'Almirante da Marinha dos EUA e cientista da computação. Pioneira no desenvolvimento de compiladores e linguagens de programação, criou o termo "bug".',
            emoji: '🖥️'
        }, {
            id: 7,
            nome: 'Jane Goodall',
            area: 'Biologia e Primatologia',
            bio: 'Revolucionou o estudo dos primatas com suas observações sobre chimpanzés na Tanzânia. Mostrou que eles usam ferramentas, o que mudou a visão sobre a inteligência animal.',
            emoji: '🐒'
        }, {
            id: 8,
            nome: 'Mary Somerville',
            area: 'Ciência e Divulgação',
            bio: 'Cientista e divulgadora escocesa, traduziu e popularizou obras científicas. O termo "cientista" foi cunhado para ela, pois seu conhecimento abrangia várias áreas.',
            emoji: '📚'
        }, {
            id: 9,
            nome: 'Mae Jemison',
            area: 'Astronáutica e Medicina',
            bio: 'Primeira mulher afro-americana a viajar ao espaço, a bordo do ônibus espacial Endeavour. Também é médica e ativista pela educação em ciências.',
            emoji: '👩🏾‍🚀'
        }];

        // ----- CENA PRINCIPAL -----
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);

        // Câmera
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 4, 18);
        camera.lookAt(0, 0, 0);

        // Renderizador WebGL
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = false;
        document.body.appendChild(renderer.domElement);

        // Renderizador CSS2D (labels)
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0';
        labelRenderer.domElement.style.left = '0';
        labelRenderer.domElement.style.pointerEvents = 'none'; // cliques nos labels por eventos próprios
        document.getElementById('label-renderer').appendChild(labelRenderer.domElement);

        // Controles Orbit (para desktop / VR com toque)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false;
        controls.enableZoom = true;
        controls.rotateSpeed = 0.5;
        controls.target.set(0, 0, 0);
        controls.update();

        // ----- LUZES -----
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(1, 2, 3);
        scene.add(dirLight);

        const backLight = new THREE.PointLight(0x4466ff, 0.5);
        backLight.position.set(-2, -1, -5);
        scene.add(backLight);

        // ----- GALÁXIA (partículas) -----
        const particleCount = 12000;
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);
        const sizes = new Float32Array(particleCount);

        const spiralArms = 3;
        const armSpread = 0.6;
        const radiusMax = 8;
        const radiusMin = 1.5;

        for (let i = 0; i < particleCount; i++) {
            // Distribuição em espiral
            const arm = i % spiralArms;
            const t = i / particleCount;
            const radius = radiusMin + t * (radiusMax - radiusMin);
            const angle = t * Math.PI * 10 + (arm / spiralArms) * Math.PI * 2;
            const randomOffset = (Math.random() - 0.5) * armSpread * (1 + t * 0.5);
            const x = Math.cos(angle + randomOffset) * radius;
            const z = Math.sin(angle + randomOffset) * radius;
            const y = (Math.random() - 0.5) * 1.2 * (1 - t * 0.3);

            positions[i * 3] = x;
            positions[i * 3 + 1] = y;
            positions[i * 3 + 2] = z;

            // Cor: azul / roxo / branco
            const color = new THREE.Color();
            const r = 0.4 + 0.6 * Math.random();
            const g = 0.3 + 0.7 * Math.random() * (1 - t * 0.3);
            const b = 0.6 + 0.4 * Math.random() * (1 + t * 0.2);
            color.setRGB(r, g, b);
            colors[i * 3] = color.r;
            colors[i * 3 + 1] = color.g;
            colors[i * 3 + 2] = color.b;

            sizes[i] = 0.05 + 0.15 * Math.random() * (1 + t);
        }

        const particleGeometry = new THREE.BufferGeometry();
        particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        particleGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        particleGeometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

        const particleTexture = (() => {
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.2, 'rgba(255,255,255,0.8)');
            gradient.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 32, 32);
            return new THREE.CanvasTexture(canvas);
        })();

        const particleMaterial = new THREE.PointsMaterial({
            size: 0.12,
            map: particleTexture,
            vertexColors: true,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true,
        });

        const particles = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(particles);

        // ----- GRUPO PARA GALÁXIA + LABELS (gira junto) -----
        const galaxyGroup = new THREE.Group();
        scene.add(galaxyGroup);

        // Adicionar partículas ao grupo? Melhor manter separado para não girar? Vamos girar o grupo e adicionar as partículas também?
        // Vamos mover as partículas para o grupo para girar tudo junto.
        galaxyGroup.add(particles);

        // ----- CRIAR LABELS (CSS2D) -----
        const labelGroup = new THREE.Group();
        galaxyGroup.add(labelGroup);

        // Função para criar um cartão label
        function createLabel(cientista, index) {
            const div = document.createElement('div');
            div.className = 'label-card';
            div.dataset.id = cientista.id;
            div.innerHTML = `
                <div class="nome">${cientista.emoji} ${cientista.nome}</div>
                <div class="area">${cientista.area}</div>
            `;
            // Evento de clique / toque
            div.addEventListener('click', (e) => {
                e.stopPropagation();
                abrirModal(cientista);
            });
            div.addEventListener('touchstart', (e) => {
                e.preventDefault();
                abrirModal(cientista);
            }, { passive: false });

            const label = new CSS2DObject(div);
            return label;
        }

        // Posicionar labels em órbita espiral, mas com raio um pouco maior que as partículas
        const numLabels = cientistas.length;
        const labelRadiusMin = 3.5;
        const labelRadiusMax = 7.5;

        cientistas.forEach((c, i) => {
            const label = createLabel(c, i);
            const t = i / numLabels;
            const radius = labelRadiusMin + t * (labelRadiusMax - labelRadiusMin);
            const angle = t * Math.PI * 8 + 0.5; // +0.5 para não coincidir
            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;
            const y = (Math.random() - 0.5) * 1.8;
            label.position.set(x, y, z);
            // Pequena variação
            label.userData = { angle, radius, y };
            labelGroup.add(label);
        });

        // Adicionar algumas estrelas de fundo (bem distantes)
        const starGeo = new THREE.BufferGeometry();
        const starCount = 2000;
        const starPos = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            const r = 50 + Math.random() * 100;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            starPos[i * 3] = Math.sin(phi) * Math.cos(theta) * r;
            starPos[i * 3 + 1] = Math.sin(phi) * Math.sin(theta) * r;
            starPos[i * 3 + 2] = Math.cos(phi) * r;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starMat = new THREE.PointsMaterial({
            color: 0x8888aa,
            size: 0.3,
            transparent: true,
            opacity: 0.6,
            sizeAttenuation: true,
        });
        const stars = new THREE.Points(starGeo, starMat);
        scene.add(stars);

        // ----- MODAL -----
        const modalOverlay = document.getElementById('modal-overlay');
        const modalNome = document.getElementById('modal-nome');
        const modalArea = document.getElementById('modal-area');
        const modalBio = document.getElementById('modal-bio');
        const modalFoto = document.getElementById('modal-foto');
        const modalFechar = document.getElementById('modal-fechar');

        function abrirModal(cientista) {
            modalNome.textContent = cientista.nome;
            modalArea.textContent = cientista.area;
            modalBio.textContent = cientista.bio;
            modalFoto.textContent = cientista.emoji || '👩‍🔬';
            modalOverlay.classList.add('active');
        }

        function fecharModal() {
            modalOverlay.classList.remove('active');
        }

        modalFechar.addEventListener('click', fecharModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) fecharModal();
        });

        // ----- AJUSTE DE TELA -----
        function onResize() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            labelRenderer.setSize(w, h);
        }
        window.addEventListener('resize', onResize);

        // ----- ANIMAÇÃO -----
        let clock = new THREE.Clock();

        function animate() {
            const delta = clock.getDelta();
            const elapsed = performance.now() / 1000;

            // Girar galáxia lentamente
            galaxyGroup.rotation.y += delta * 0.05;

            // Pequena flutuação nos labels (efeito orgânico)
            labelGroup.children.forEach((label, i) => {
                const offset = Math.sin(elapsed * 0.5 + i) * 0.03;
                label.position.y += Math.sin(elapsed * 0.7 + i * 1.2) * 0.001;
            });

            // Rotação das estrelas de fundo bem lenta
            stars.rotation.y += delta * 0.003;

            controls.update();

            // Renderizar
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);

            requestAnimationFrame(animate);
        }

        animate();

        // Pequeno helper: se clicar fora dos labels, não faz nada
        renderer.domElement.addEventListener('click', () => {});

        console.log('🚀 Galáxia das Cientistas carregada! Toque nos cartões para saber mais.');
    </script>
</body>
</html>
